services:
  - type: web
    name: onika-anime
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: onika-anime-db
          property: connectionString
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: CACHE_TTL
        value: 300
    databases:
      - name: onika-anime-db
        databaseName: onika_anime
